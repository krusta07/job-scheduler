services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobscheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/jobscheduler
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app

  worker1:
    build: .
    command: python -m app.worker
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://admin:password@postgres:5432/jobscheduler
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker_1
    volumes:
      - .:/app

  worker2:
    build: .
    command: python -m app.worker
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://admin:password@postgres:5432/jobscheduler
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker_2
    volumes:
      - .:/app

  worker3:
    build: .
    command: python -m app.worker
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://admin:password@postgres:5432/jobscheduler
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker_3
    volumes:
      - .:/app

volumes:
  postgres_data: